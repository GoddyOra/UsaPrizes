name: Update lottery results

on:
  schedule:
    # Daily at 09:00 UTC — safely after any Powerball (Mon/Wed/Sat) or Mega Millions (Tue/Fri)
    # draw the previous night regardless of EST/EDT, plus a buffer for data.ny.gov posting lag.
    # GitHub Actions cron is UTC-only and can itself lag 10-30 min at peak times — see
    # docs/KEYWORD_MAP.md's parent plan (Phase 3) for the caveats this schedule works around.
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lottery-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest draw results
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: node scripts/fetch-lottery-results.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "usaprizes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/lottery/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed_files=" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
            git commit -m "Update lottery results [automated]"
            git push
            echo "changed_files=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

      # Pings Bing/Yandex (IndexNow participants — not Google, which has no equivalent API)
      # so the updated result page gets picked up faster than waiting on normal crawl discovery.
      - name: Ping IndexNow for changed pages
        if: steps.commit.outputs.changed_files != ''
        run: |
          URLS="[]"
          for f in ${{ steps.commit.outputs.changed_files }}; do
            case "$f" in
              *powerball.json) URLS=$(echo "$URLS" | jq '. + ["https://usaprizes.com/lottery/powerball/"]') ;;
              *mega-millions.json) URLS=$(echo "$URLS" | jq '. + ["https://usaprizes.com/lottery/mega-millions/"]') ;;
            esac
          done
          if [ "$URLS" != "[]" ]; then
            curl -s -X POST https://api.indexnow.org/indexnow \
              -H "Content-Type: application/json" \
              -d "$(jq -n --argjson urls "$URLS" '{
                host: "usaprizes.com",
                key: "0e93521195a46f22062beba56f87d164",
                keyLocation: "https://usaprizes.com/0e93521195a46f22062beba56f87d164.txt",
                urlList: $urls
              }')"
          fi
